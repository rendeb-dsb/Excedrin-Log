<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<link rel="manifest" href="manifest.json">
<title>Excedrin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="title-row"><h1>Excedrin</h1><span id="versionLabel">v27</span></div><div id="timeSince" class="time-since">Time since last use: 00:00:00</div></header>

<nav class="filebar">
  <div class="menu-group">
    <button id="fileButton" aria-expanded="false">Actions</button>
    <div id="fileMenu" class="file-menu hidden" role="menu">
    <button data-action="add">Add</button>
    <button data-action="change">Change</button>
    <button data-action="delete">Delete</button>
    <button data-action="list">List</button>
    <div class="separator"></div>
    <button data-action="import">Import</button>
    <button data-action="export">Export</button>
    <div class="separator"></div>
    <button data-action="quit">Quit</button>
    </div>
  </div>
  <div class="menu-group stats-group"><button id="statsButton">Stats</button></div>
</nav>

<main id="listScreen">
  <table>
    <colgroup><col class="col-select"><col class="col-day"><col class="col-date"><col class="col-time"></colgroup>
    <thead><tr><th aria-label="Selection"></th><th>Day</th><th>Date</th><th>Time</th></tr></thead>
    <tbody id="recordBody"></tbody>
  </table>
  <div id="emptyMessage" class="empty">No records.</div>
</main>

<section id="statsScreen" class="hidden">
  <div class="stats-card">
    <h2>Stats</h2>
    <table class="stats-table stats-summary">
      <tbody>
        <tr><th>Rows</th><td id="statsRowCount">0</td></tr>
      </tbody>
    </table>

    <h3>Frequency</h3>
    <table class="stats-table">
      <tbody id="frequencyBody"></tbody>
    </table>

    <h3>Gaps</h3>
    <table class="stats-table">
      <tbody id="gapBody"></tbody>
    </table>
  </div>
</section>

<section id="editScreen" class="hidden">
  <div class="form-card">
    <h2 id="editTitle">Add</h2>
    <div class="date-time-row">
      <label for="dateInput">Date</label>
      <input id="dateInput" class="date-entry" type="text" inputmode="numeric" maxlength="10" placeholder="__/__/____" autocomplete="off">
      <label for="timeInput">Time</label>
      <input id="timeInput" class="time-entry" type="text" inputmode="numeric" maxlength="5" placeholder="__:__" autocomplete="off">
    </div>
    <div class="buttons">
      <button id="saveBtn">Save</button>
      <button id="cancelBtn">Cancel</button>
    </div>
    <div id="validation" class="validation"></div>
  </div>
</section>

<div id="dialog" class="dialog hidden">
  <div class="dialog-card">
    <div id="dialogMessage"></div>
    <div id="dialogContent"></div>
  </div>
</div>
<input id="fileInput" type="file" accept=".csv,text/csv" class="hidden">

<script src="app.js"></script>
</body>
</html>
